name: CI

on:
  push:
    branches: [snapshot, main]
  pull_request:
    branches: [snapshot, main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Grammar → src/generated, then both packages: the language first, the worker builds against it
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run

      - name: Upload build artifacts
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/language/dist/
            packages/language/syntaxes/
            packages/lsp-worker/dist/
          retention-days: 30
